trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'windows-latest'

steps:
- checkout: self
  clean: true

- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '9.x'
  displayName: 'Install .NET SDK'

- script: |
    echo "Building Oqtane Server..."
    dotnet build Oqtane.Server.sln -c Release
  displayName: 'Build Oqtane Server'

- script: |
    echo "Publishing Oqtane Server..."
    dotnet publish Oqtane.Server.sln -c Release -o $(Build.ArtifactStagingDirectory)/oqtane
  displayName: 'Publish Oqtane Server'

- task: AzureWebApp@1
  inputs:
    azureSubscription: '33ccb08b-86ec-4841-9327-6f308fb703d4'
    appName: 'RubbishFastApp'
    package: '$(Build.ArtifactStagingDirectory)/oqtane'
  displayName: 'Deploy Oqtane to Azure Web App'